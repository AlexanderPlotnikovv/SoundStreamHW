defaults:
  - model: soundstream
  - writer: cometml
  - metrics: soundstream
  - datasets: librispeech
  - dataloader: soundstream
  - transforms: null
  - _self_

optimizer:
  _target_: torch.optim.Adam
  lr: 0.0001
  betas: [ 0.5, 0.9 ]

optimizer_d:
  _target_: torch.optim.Adam
  lr: 0.0001
  betas: [ 0.5, 0.9 ]

lr_scheduler:
  _target_: torch.optim.lr_scheduler.LambdaLR
  lr_lambda: "lambda epoch: 1"

criterion:
  _target_: src.loss.losses.GeneratorLoss
  lambda_commit: 1.0
  lambda_feat: 100.0

discriminator:
  _target_: src.model.discriminator.Discriminator

trainer:
  log_step: 50
  n_epochs: 50
  epoch_len: 900
  device_tensors: [ "audio" ]
  resume_from: null
  device: auto
  override: False
  monitor: "max val_STOI"
  save_period: 5
  early_stop: 50
  save_dir: "saved"
  seed: 1
  max_grad_norm: 10.0
